name: Documentation request
description: Request a clarification, correction, or new technical guide.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: File or section
      description: Name the documentation page or section.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: false
