name: Repository documentation checks

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/update-readme.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check local Markdown links in README
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path(".")
          readme = (root / "README.md").read_text(encoding="utf-8")
          targets = re.findall(r"\[[^\]]+\]\(([^)]+)\)", readme)
          broken = []
          for target in targets:
              if target.startswith(("https://", "http://", "mailto:", "#")):
                  continue
              target_path = target.split("#", 1)[0]
              if target_path and not (root / target_path).exists():
                  broken.append(target)
          if broken:
              raise SystemExit("Broken local README links:\n" + "\n".join(broken))
          print(f"Checked {len(targets)} README links")
          PY
