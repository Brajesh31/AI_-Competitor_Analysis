name: Repository documentation checks

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/update-readme.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify documentation files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "docs/README.md",
              "docs/user-guide.md",
              "docs/installation.md",
              "docs/configuration.md",
              "docs/architecture.md",
              "docs/architecture-decisions.md",
              "docs/api.md",
              "docs/api-examples.md",
              "docs/provider-integrations.md",
              "docs/data-and-exports.md",
              "docs/data-dictionary.md",
              "docs/database.md",
              "docs/security.md",
              "docs/privacy.md",
              "docs/scraping.md",
              "docs/development.md",
              "docs/testing.md",
              "docs/accessibility.md",
              "docs/performance.md",
              "docs/deployment.md",
              "docs/operations.md",
              "docs/release-process.md",
              "docs/troubleshooting.md",
              "docs/faq.md",
              "docs/known-ui-issues.md",
              "docs/limitations.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing documentation files:\n" + "\n".join(missing))
          print(f"Verified {len(required)} documentation files.")
          PY
