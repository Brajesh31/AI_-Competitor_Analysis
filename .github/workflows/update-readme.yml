name: Repository documentation checks

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/update-readme.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify documented local targets
        run: |
          test -f PDS_PROJECT.ipynb || true
          test -f results\ \(1\).csv
          test -f docs/README.md
          test -f docs/installation.md
          test -f docs/configuration.md
          test -f docs/architecture.md
          test -f docs/api.md
          test -f docs/data-and-exports.md
          test -f docs/security.md
          test -f docs/scraping.md
          test -f docs/development.md
          test -f docs/testing.md
          test -f docs/deployment.md
          test -f docs/troubleshooting.md
          test -f docs/faq.md
          test -f docs/limitations.md
          echo "Required documentation targets exist."
